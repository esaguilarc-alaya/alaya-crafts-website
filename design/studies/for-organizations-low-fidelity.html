:root[data-theme=&quot;light&quot;] {

}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

a:is(:hover, :focus-visible) {

h3,

b,

}

}

.table :is(th, td) {

  overflow-wrap: anywhere;

}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {

}

.table thead th {

}

}

}

.card {

  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);

  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {

  z-index: 50;
  top: 0;
  left: 0;

  align-items: center;
  gap: 10px;

  flex-wrap: wrap;
  align-items: center;
  gap: 8px;

  gap: 2px 12px;
  margin-bottom: 0;

.btn,
.form-check-input,
.form-control,
.form-range,

a.btn {

  text-decoration: none;

.btn:not(:disabled):hover {

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {

  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  flex: none;

  &lt;div class=&quot;study-tools&quot;&gt;
    &lt;div&gt;&lt;button class=&quot;btn btn-primary&quot; type=&quot;button&quot; data-view=&quot;desktop&quot; aria-pressed=&quot;true&quot;&gt;Desktop study&lt;/button&gt;&lt;button class=&quot;btn&quot; type=&quot;button&quot; data-view=&quot;mobile&quot; aria-pressed=&quot;false&quot;&gt;Mobile study&lt;/button&gt;&lt;/div&gt;

  &lt;div class=&quot;study-layout&quot;&gt;
    &lt;div class=&quot;stage&quot;&gt;
      &lt;main class=&quot;org-page is-desktop&quot; aria-label=&quot;For Organizations public page low-fidelity study&quot;&gt;
        &lt;header class=&quot;site-head&quot;&gt;&lt;div class=&quot;brand&quot;&gt;Alaya Crafts&lt;/div&gt;&lt;nav class=&quot;nav&quot; aria-label=&quot;Public site navigation&quot;&gt;&lt;span&gt;The Alaya Idea&lt;/span&gt;&lt;span&gt;CIE Professional&lt;/span&gt;&lt;span&gt;For Organizations&lt;/span&gt;&lt;span&gt;Ideas&lt;/span&gt;&lt;span&gt;Contact&lt;/span&gt;&lt;/nav&gt;&lt;div class=&quot;mobile-menu&quot;&gt;Explore&lt;/div&gt;&lt;/header&gt;

        &lt;section class=&quot;page-section hero is-active&quot; data-section=&quot;principle&quot;&gt;
          &lt;span class=&quot;eyebrow&quot;&gt;01 — For Organizations&lt;/span&gt;&lt;h1 class=&quot;display&quot;&gt;What CIE Professional begins with one person, Alaya is learning to understand at organizational scale.&lt;/h1&gt;
          &lt;div class=&quot;lineage&quot;&gt;CIE Professional builds an evidence-grounded understanding of capability from the work, experience, evidence, reflection, objectives, and relationships that give it shape.&lt;br&gt;&lt;br&gt;The same principle matters across an organization: capability should be understood through the work that reveals it, not assumed from roles, structures, or headcount.&lt;/div&gt;
          &lt;div class=&quot;status-note&quot;&gt;CIE Organization is a direction under development—not yet a launched product.&lt;/div&gt;
        &lt;/section&gt;

        &lt;section class=&quot;page-section thesis&quot; data-section=&quot;thesis&quot;&gt;
          &lt;span class=&quot;eyebrow&quot;&gt;02 — Thesis&lt;/span&gt;&lt;div class=&quot;thesis-lines&quot;&gt;&lt;p&gt;Strategy gives capability direction.&lt;/p&gt;&lt;p&gt;Capability turns strategy into action.&lt;/p&gt;&lt;/div&gt;
          &lt;p class=&quot;lede&quot;&gt;Strategy can set a clear destination while leaving a harder question unanswered: does the capability to carry it out already exist, is it fragmented, or was it never there?&lt;/p&gt;
        &lt;/section&gt;

        &lt;section class=&quot;page-section&quot; data-section=&quot;condition&quot;&gt;
          &lt;span class=&quot;eyebrow&quot;&gt;03 — The organizational condition&lt;/span&gt;&lt;h2 class=&quot;headline&quot;&gt;A network operations team needed to pivot and upskill to support a CDN solution. Leadership opted for training from the provider.&lt;/h2&gt;
          &lt;div class=&quot;case-field&quot;&gt;&lt;div class=&quot;case-context&quot;&gt;That decision looked aligned. It began from an incomplete picture.&lt;/div&gt;&lt;div class=&quot;case-story&quot;&gt;But the decision itself was built on a miscalibration—overstating what some engineers already knew, and underestimating what others were capable of.&lt;br&gt;&lt;br&gt;Without visibility into actual capability, resources drain, motivation erodes, and strategy stalls.&lt;/div&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;section class=&quot;page-section&quot; data-section=&quot;visibility&quot;&gt;
          &lt;span class=&quot;eyebrow&quot;&gt;04 — What is difficult to see&lt;/span&gt;&lt;h2 class=&quot;headline&quot;&gt;Organizations can misread capability in both directions at once.&lt;/h2&gt;
          &lt;div class=&quot;decision-line&quot;&gt;&lt;div class=&quot;assumption over&quot;&gt;&lt;strong&gt;Overstated&lt;/strong&gt;&lt;p&gt;A role, reputation, or past exposure implies depth the work does not yet support.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;same-decision&quot;&gt;The same&lt;br&gt;training decision&lt;/div&gt;&lt;div class=&quot;assumption under&quot;&gt;&lt;strong&gt;Underestimated&lt;/strong&gt;&lt;p&gt;Valuable capability remains hidden behind assignment, title, visibility, or circumstance.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;p class=&quot;visibility-explanation&quot;&gt;Both readings can grow from the same conditions: knowledge fragmented across teams and systems, important capability remaining implicit in practice, and what already exists unable to travel to the work that needs it.&lt;/p&gt;
        &lt;/section&gt;

        &lt;section class=&quot;page-section lens&quot; data-section=&quot;lens&quot;&gt;
          &lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;05 — A different lens&lt;/span&gt;&lt;h2 class=&quot;headline&quot;&gt;What changes when capability becomes a unit of understanding?&lt;/h2&gt;&lt;p class=&quot;lens-shift&quot;&gt;An organization can ask not only who occupies a role, but what capability the work has cultivated, what evidence grounds that understanding, how knowledge moves, and what may need to be cultivated next.&lt;br&gt;&lt;br&gt;This is not a score, ranking, or capability heatmap. Teams appear within the landscape—not as a separate product.&lt;/p&gt;&lt;/div&gt;
          &lt;div class=&quot;landscape&quot; aria-label=&quot;An organizational capability landscape connecting people, teams, knowledge, and work.&quot;&gt;&lt;span class=&quot;scale people&quot;&gt;People&lt;/span&gt;&lt;span class=&quot;scale teams&quot;&gt;Teams&lt;/span&gt;&lt;span class=&quot;scale knowledge&quot;&gt;Knowledge&lt;/span&gt;&lt;span class=&quot;scale work&quot;&gt;Work&lt;/span&gt;&lt;span class=&quot;scale capability&quot;&gt;Capability landscape&lt;/span&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;section class=&quot;page-section&quot; data-section=&quot;questions&quot;&gt;
          &lt;span class=&quot;eyebrow&quot;&gt;06 — Questions Alaya explores&lt;/span&gt;&lt;h2 class=&quot;headline&quot;&gt;The direction begins with questions, not a service catalogue.&lt;/h2&gt;
          &lt;div class=&quot;questions&quot;&gt;&lt;div class=&quot;question&quot;&gt;&lt;span&gt;01&lt;/span&gt;Where does strategy depend on capability the organization cannot yet see clearly?&lt;/div&gt;&lt;div class=&quot;question&quot;&gt;&lt;span&gt;02&lt;/span&gt;What knowledge disappears between teams, systems, or changes in responsibility?&lt;/div&gt;&lt;div class=&quot;question&quot;&gt;&lt;span&gt;03&lt;/span&gt;Where is technology introduced without the capability needed to sustain it?&lt;/div&gt;&lt;div class=&quot;question&quot;&gt;&lt;span&gt;04&lt;/span&gt;What capability already exists but remains fragmented, implicit, or difficult to reuse?&lt;/div&gt;&lt;div class=&quot;question&quot;&gt;&lt;span&gt;05&lt;/span&gt;Which training decisions begin before the real starting point is understood?&lt;/div&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;section class=&quot;page-section technology&quot; data-section=&quot;technology&quot;&gt;
          &lt;div&gt;&lt;span class=&quot;eyebrow&quot;&gt;07 — Technology’s role&lt;/span&gt;&lt;h2 class=&quot;headline&quot;&gt;Technology can connect understanding.&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;technology-copy&quot;&gt;&lt;strong&gt;It cannot substitute for capability.&lt;/strong&gt;&lt;br&gt;&lt;br&gt;Its role is to help preserve evidence, reveal relationships, connect knowledge to work, and make an evolving capability landscape usable. The people, work, and knowledge remain the source.&lt;/div&gt;
        &lt;/section&gt;

        &lt;section class=&quot;page-section provenance&quot; data-section=&quot;provenance&quot;&gt;
          &lt;span class=&quot;eyebrow&quot;&gt;08 — Human provenance&lt;/span&gt;&lt;p class=&quot;origin-copy&quot;&gt;This direction grew from more than two decades of work across technology, engineering, network operations, leadership, product thinking, organizational systems, knowledge, and execution—and from repeatedly seeing how much important capability remains difficult to recognize until the work demands it.&lt;/p&gt;
        &lt;/section&gt;

        &lt;section class=&quot;page-section&quot; data-section=&quot;paths&quot;&gt;
          &lt;span class=&quot;eyebrow&quot;&gt;09 — Open paths&lt;/span&gt;&lt;div class=&quot;open-paths&quot;&gt;&lt;div class=&quot;shape-path&quot;&gt;&lt;h3&gt;Help shape the direction&lt;/h3&gt;&lt;p&gt;If this matches something you have seen, and you would want to help shape CIE Organization before launch, share the experience with Alaya.&lt;/p&gt;&lt;span class=&quot;path-label&quot;&gt;Share what you have seen&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;general-path&quot;&gt;&lt;h3&gt;Start a general conversation&lt;/h3&gt;&lt;p&gt;If something here connects with a question you are exploring, an idea you are developing, or work you are trying to understand, write to Alaya directly. Your message will be read and answered by a person.&lt;/p&gt;&lt;span class=&quot;path-label&quot;&gt;Contact Alaya&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;footer class=&quot;site-foot&quot;&gt;&lt;span&gt;Alaya Crafts&lt;/span&gt;&lt;span&gt;The Alaya Idea · CIE Professional · Organizations · Ideas · Contact&lt;/span&gt;&lt;span&gt;Capability is the enduring asset.&lt;/span&gt;&lt;/footer&gt;
      &lt;/main&gt;
    &lt;/div&gt;

    &lt;aside class=&quot;inspector card&quot; aria-live=&quot;polite&quot;&gt;
      &lt;div class=&quot;text-small text-muted&quot;&gt;Section &lt;span id=&quot;org-number&quot;&gt;01&lt;/span&gt;&lt;/div&gt;&lt;h3 id=&quot;org-title&quot;&gt;Shared principle&lt;/h3&gt;&lt;dl&gt;&lt;dt&gt;Composition&lt;/dt&gt;&lt;dd id=&quot;org-composition&quot;&gt;&lt;/dd&gt;&lt;dt&gt;Hierarchy&lt;/dt&gt;&lt;dd id=&quot;org-hierarchy&quot;&gt;&lt;/dd&gt;&lt;dt&gt;Mobile&lt;/dt&gt;&lt;dd id=&quot;org-mobile&quot;&gt;&lt;/dd&gt;&lt;dt&gt;Guardrail&lt;/dt&gt;&lt;dd id=&quot;org-guardrail&quot;&gt;&lt;/dd&gt;&lt;/dl&gt;
    &lt;/aside&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (()=&gt;{
      const root=document.getElementById(&#x27;for-organizations-study&#x27;);
      const page=root.querySelector(&#x27;.org-page&#x27;);
      const notes={
        principle:{n:&#x27;01&#x27;,t:&#x27;Shared principle&#x27;,composition:&#x27;A restrained opening establishes CIE Professional lineage before making any organizational claim.&#x27;,hierarchy:&#x27;The real method comes first; the future organizational direction is explicitly labeled.&#x27;,mobile:&#x27;The lineage becomes one readable column and the maturity note remains visible.&#x27;,guardrail:&#x27;Do not imply organizational product availability or an active practice.&#x27;},
        thesis:{n:&#x27;02&#x27;,t:&#x27;Thesis&#x27;,composition:&#x27;A full-width couplet creates a conceptual pause after the credibility-bearing opening.&#x27;,hierarchy:&#x27;Strategy directs; capability acts. Neither is reduced to an execution slogan.&#x27;,mobile:&#x27;The two lines retain separate rhythm without forced side-by-side treatment.&#x27;,guardrail:&#x27;Avoid “strategy-to-execution friction” and other worn transformation language.&#x27;},
        condition:{n:&#x27;03&#x27;,t:&#x27;Organizational condition&#x27;,composition:&#x27;The concrete operational scene carries the headline weight; the generalization becomes a quiet caption beside the consequence.&#x27;,hierarchy:&#x27;The real example earns attention before the page interprets it.&#x27;,mobile:&#x27;The longer scene-setting headline is followed by the short caption, then the miscalibration and consequence.&#x27;,guardrail:&#x27;No outcome, client relationship, or Alaya intervention is implied.&#x27;},
        visibility:{n:&#x27;04&#x27;,t:&#x27;Difficult to see&#x27;,composition:&#x27;One two-direction miscalibration remains the central structure; fragmented, implicit, and immobile capability are absorbed into its explanation.&#x27;,hierarchy:&#x27;Overstatement and underestimation receive equal weight without introducing a second framework.&#x27;,mobile:&#x27;The two sides become a vertical sequence followed by one explanatory paragraph.&#x27;,guardrail:&#x27;No maturity scale, score, assessment, heatmap, or stacked consulting framework.&#x27;},
        lens:{n:&#x27;05&#x27;,t:&#x27;Different lens&#x27;,composition:&#x27;Editorial copy sits beside one abstract widening field across organizational scales.&#x27;,hierarchy:&#x27;Capability is the unit of understanding; people are never reduced to a metric.&#x27;,mobile:&#x27;The field follows the explanation and remains conceptual.&#x27;,guardrail:&#x27;Teams stay inside the organizational landscape, never presented as an offering.&#x27;},
        questions:{n:&#x27;06&#x27;,t:&#x27;Questions Alaya explores&#x27;,composition:&#x27;Five ruled questions create depth without resembling service pillars.&#x27;,hierarchy:&#x27;Questions remain open territories rather than promised deliverables.&#x27;,mobile:&#x27;Each question becomes a compact chapter with its number retained.&#x27;,guardrail:&#x27;Do not turn these into clickable offerings or diagnostic intake.&#x27;},
        technology:{n:&#x27;07&#x27;,t:&#x27;Technology’s role&#x27;,composition:&#x27;A lightly differentiated field separates connection from substitution.&#x27;,hierarchy:&#x27;People, work, and knowledge remain the source; technology supports use.&#x27;,mobile:&#x27;The qualification follows the headline immediately.&#x27;,guardrail:&#x27;No AI protagonist, platform claim, or automation theater.&#x27;},
        provenance:{n:&#x27;08&#x27;,t:&#x27;Human provenance&#x27;,composition:&#x27;One sustained sentence with substantial space; no founder biography grid.&#x27;,hierarchy:&#x27;Lived operational continuity supports the direction without becoming authority theater.&#x27;,mobile:&#x27;The sentence breaks naturally into a readable editorial block.&#x27;,guardrail:&#x27;Do not convert experience into logos, named clients, or inflated credentials.&#x27;},
        paths:{n:&#x27;09&#x27;,t:&#x27;Open paths&#x27;,composition:&#x27;The pre-launch shaping invitation is larger and bounded; general contact remains quieter and separate.&#x27;,hierarchy:&#x27;Help us think is not confused with discuss an engagement.&#x27;,mobile:&#x27;The two invitations stack with explicit distinction.&#x27;,guardrail:&#x27;No form funnel, callback promise, Calendly, chatbot, or lead qualification.&#x27;}
      };
      function show(k){const d=notes[k];if(!d)return;root.querySelectorAll(&#x27;.page-section&#x27;).forEach(s=&gt;s.classList.toggle(&#x27;is-active&#x27;,s.dataset.section===k));root.querySelector(&#x27;#org-number&#x27;).textContent=d.n;root.querySelector(&#x27;#org-title&#x27;).textContent=d.t;[&#x27;composition&#x27;,&#x27;hierarchy&#x27;,&#x27;mobile&#x27;,&#x27;guardrail&#x27;].forEach(x=&gt;root.querySelector(&#x27;#org-&#x27;+x).textContent=d[x]);}
      root.querySelectorAll(&#x27;.page-section&#x27;).forEach(s=&gt;s.addEventListener(&#x27;click&#x27;,()=&gt;show(s.dataset.section)));
      const siteHead=root.querySelector(&#x27;.site-head&#x27;);
      const mobileMenu=root.querySelector(&#x27;.mobile-menu&#x27;);
      const mobileViewport=window.matchMedia(&#x27;(max-width:820px)&#x27;);
      const setMenu=open=&gt;{siteHead.classList.toggle(&#x27;nav-open&#x27;,open);mobileMenu.setAttribute(&#x27;aria-expanded&#x27;,String(open));mobileMenu.textContent=open?&#x27;Close&#x27;:&#x27;Explore&#x27;;};
      mobileMenu.setAttribute(&#x27;role&#x27;,&#x27;button&#x27;);
      mobileMenu.setAttribute(&#x27;tabindex&#x27;,&#x27;0&#x27;);
      mobileMenu.setAttribute(&#x27;aria-expanded&#x27;,&#x27;false&#x27;);
      mobileMenu.setAttribute(&#x27;aria-label&#x27;,&#x27;Toggle site navigation&#x27;);
      mobileMenu.addEventListener(&#x27;click&#x27;,()=&gt;setMenu(!siteHead.classList.contains(&#x27;nav-open&#x27;)));
      mobileMenu.addEventListener(&#x27;keydown&#x27;,e=&gt;{if(e.key===&#x27;Enter&#x27;||e.key===&#x27; &#x27;){e.preventDefault();setMenu(!siteHead.classList.contains(&#x27;nav-open&#x27;));}});
      root.querySelectorAll(&#x27;.nav span&#x27;).forEach(item=&gt;item.addEventListener(&#x27;click&#x27;,()=&gt;setMenu(false)));
      mobileViewport.addEventListener(&#x27;change&#x27;,e=&gt;{if(!e.matches)setMenu(false);});
      root.querySelectorAll(&#x27;[data-view]&#x27;).forEach(b=&gt;b.addEventListener(&#x27;click&#x27;,()=&gt;{const m=b.dataset.view===&#x27;mobile&#x27;;page.classList.toggle(&#x27;is-mobile&#x27;,m);page.classList.toggle(&#x27;is-desktop&#x27;,!m);if(!m&amp;&amp;!mobileViewport.matches)setMenu(false);root.querySelectorAll(&#x27;[data-view]&#x27;).forEach(x=&gt;{const active=x===b;x.setAttribute(&#x27;aria-pressed&#x27;,String(active));x.classList.toggle(&#x27;btn-primary&#x27;,active);});}));
      show(&#x27;principle&#x27;);
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;

(() =&gt; {

    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
