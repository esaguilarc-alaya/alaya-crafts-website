  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);

  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-destructive {

}

        &lt;section class=&quot;page-section hero is-active&quot; data-section=&quot;opening&quot;&gt;
          &lt;span class=&quot;eyebrow&quot;&gt;01 — CIE Professional&lt;/span&gt;&lt;h1 class=&quot;display&quot;&gt;Your career is bigger than your résumé.&lt;/h1&gt;
          &lt;p class=&quot;opening&quot;&gt;Most professional tools start with a résumé, job title, or list of skills.&lt;br&gt;&lt;br&gt;&lt;strong&gt;CIE starts with your curiosity.&lt;/strong&gt;&lt;/p&gt;
          &lt;div class=&quot;quiet-paths&quot;&gt;&lt;span&gt;See how understanding grows&lt;/span&gt;&lt;span&gt;What is CIE?&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;hero-trace&quot; aria-hidden=&quot;true&quot;&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;section class=&quot;page-section&quot; data-section=&quot;beyond&quot;&gt;
          &lt;span class=&quot;eyebrow&quot;&gt;02 — Beyond representation&lt;/span&gt;&lt;h2 class=&quot;headline&quot;&gt;A professional life cannot be reduced to its latest summary.&lt;/h2&gt;
          &lt;div class=&quot;comparison&quot;&gt;&lt;div class=&quot;old&quot;&gt;&lt;h3&gt;Most tools begin with representation&lt;/h3&gt;&lt;p&gt;Titles, skills, profiles, and documents describe only what has already been made visible.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;cie&quot;&gt;&lt;h3&gt;CIE begins with capability&lt;/h3&gt;&lt;p&gt;It helps uncover the capability cultivated through your work and builds a richer understanding of the experience, evidence, contributions, and recurring patterns behind it—including important work that may have disappeared behind a role or title.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;section class=&quot;page-section&quot; data-section=&quot;understanding&quot;&gt;
          &lt;span class=&quot;eyebrow&quot;&gt;03 — A growing professional understanding&lt;/span&gt;&lt;h2 class=&quot;headline&quot;&gt;Build an understanding grounded in what you have actually done.&lt;/h2&gt;
          &lt;div class=&quot;understanding-field&quot;&gt;&lt;p class=&quot;understanding-copy&quot;&gt;Your experiences, evidence, capability, objectives, contributions, and reflection become connected without being flattened into a score or static profile.&lt;/p&gt;&lt;div class=&quot;knowledge-lines&quot;&gt;&lt;div class=&quot;knowledge-line&quot;&gt;&lt;span&gt;01&lt;/span&gt;&lt;div&gt;Experience gives the work context.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;knowledge-line&quot;&gt;&lt;span&gt;02&lt;/span&gt;&lt;div&gt;Evidence grounds what can be understood.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;knowledge-line&quot;&gt;&lt;span&gt;03&lt;/span&gt;&lt;div&gt;Reflection reveals meaning and uncertainty.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;knowledge-line&quot;&gt;&lt;span&gt;04&lt;/span&gt;&lt;div&gt;Objectives give the understanding direction.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;capability-landscape&quot; aria-label=&quot;Experience, evidence, contribution, reflection, and objectives connect to shape an evolving understanding of capability.&quot;&gt;&lt;div class=&quot;landscape-points&quot;&gt;&lt;div class=&quot;landscape-point&quot;&gt;&lt;strong&gt;Experience&lt;/strong&gt;What happened and the context in which it happened.&lt;/div&gt;&lt;div class=&quot;landscape-point&quot;&gt;&lt;strong&gt;Evidence&lt;/strong&gt;What grounds the understanding in inspectable work.&lt;/div&gt;&lt;div class=&quot;landscape-point&quot;&gt;&lt;strong&gt;Contribution&lt;/strong&gt;What changed because you were there.&lt;/div&gt;&lt;div class=&quot;landscape-point&quot;&gt;&lt;strong&gt;Reflection&lt;/strong&gt;What the work revealed, including uncertainty.&lt;/div&gt;&lt;div class=&quot;landscape-point&quot;&gt;&lt;strong&gt;Objectives&lt;/strong&gt;What gives the landscape direction.&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;landscape-result&quot;&gt;Capability becoming understandable&lt;/div&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;section class=&quot;page-section&quot; data-section=&quot;begin&quot;&gt;
          &lt;span class=&quot;eyebrow&quot;&gt;04 — Begin with curiosity&lt;/span&gt;&lt;h2 class=&quot;headline&quot;&gt;Start with what you already have—or simply with what is on your mind.&lt;/h2&gt;
          &lt;div class=&quot;beginnings&quot;&gt;&lt;div class=&quot;beginning&quot;&gt;&lt;span class=&quot;beginning-step&quot;&gt;1&lt;/span&gt;&lt;span class=&quot;eyebrow&quot;&gt;Bring&lt;/span&gt;&lt;strong&gt;A document or artifact&lt;/strong&gt;&lt;p&gt;A résumé, review, work sample, project brief, certificate, or something else.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;beginning&quot;&gt;&lt;span class=&quot;beginning-step&quot;&gt;2&lt;/span&gt;&lt;span class=&quot;eyebrow&quot;&gt;Connect&lt;/span&gt;&lt;strong&gt;Your current representation&lt;/strong&gt;&lt;p&gt;Begin with how your professional story is represented—and what it may leave out.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;beginning&quot;&gt;&lt;span class=&quot;beginning-step&quot;&gt;3&lt;/span&gt;&lt;span class=&quot;eyebrow&quot;&gt;Talk&lt;/span&gt;&lt;strong&gt;A conversation&lt;/strong&gt;&lt;p&gt;Start with a question, experience, objective, uncertainty, or whatever is worth exploring.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;section class=&quot;page-section&quot; data-section=&quot;practice&quot;&gt;
          &lt;span class=&quot;eyebrow&quot;&gt;05 — Capability stays alive&lt;/span&gt;&lt;h2 class=&quot;headline&quot;&gt;Understanding grows through practice, not profile completion.&lt;/h2&gt;
          &lt;div class=&quot;craft-flow&quot;&gt;&lt;div class=&quot;craft&quot;&gt;Curiosity&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;craft&quot;&gt;Understanding&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;craft&quot;&gt;Learning&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;craft&quot;&gt;Contribution&lt;/div&gt;&lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;&lt;div class=&quot;craft&quot;&gt;Reflection&lt;/div&gt;&lt;/div&gt;
          &lt;p class=&quot;lede&quot;&gt;Each return to the cycle can bring new work, evidence, questions, and discoveries into view.&lt;/p&gt;
        &lt;/section&gt;

        &lt;section class=&quot;page-section&quot; data-section=&quot;expressions&quot;&gt;
          &lt;span class=&quot;eyebrow&quot;&gt;06 — One understanding, many expressions&lt;/span&gt;&lt;h2 class=&quot;headline&quot;&gt;Use what CIE understands without starting from scratch each time.&lt;/h2&gt;
          &lt;div class=&quot;connected-list&quot;&gt;&lt;div class=&quot;connected-item&quot;&gt;&lt;strong&gt;See your landscape&lt;/strong&gt;&lt;p&gt;Explore connected capability rather than a disconnected list of skills.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;connected-item&quot;&gt;&lt;strong&gt;Understand opportunities&lt;/strong&gt;&lt;p&gt;Explore what an opportunity really requires and how that relates to the capability, experience, evidence, and unknowns you bring.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;connected-item&quot;&gt;&lt;strong&gt;Represent your work&lt;/strong&gt;&lt;p&gt;Create tailored résumés, cover letters, and other professional representations from an evidence-grounded understanding of your work.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;connected-item&quot;&gt;&lt;strong&gt;Prepare with context&lt;/strong&gt;&lt;p&gt;Bring relevant experiences, contributions, evidence, and unknowns into interviews and performance conversations.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;section class=&quot;page-section&quot; data-section=&quot;applications&quot;&gt;
          &lt;span class=&quot;eyebrow&quot;&gt;07 — Applications become part of the journey&lt;/span&gt;&lt;div class=&quot;application-memory&quot;&gt;&lt;div&gt;&lt;h2 class=&quot;headline&quot;&gt;Preserve what shaped each pursuit.&lt;/h2&gt;&lt;p class=&quot;lede&quot;&gt;Record the opportunity, professional understanding, representations, and discoveries that shaped an application. Reflect on what you learned without treating an interview, offer, or rejection as a verdict on your capability.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;pursuit-sheet&quot;&gt;&lt;span class=&quot;eyebrow&quot;&gt;Application memory&lt;/span&gt;&lt;div class=&quot;rule&quot;&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;Opportunity at the time&lt;/strong&gt;&lt;br&gt;The context and interpretation you were working from.&lt;/p&gt;&lt;div class=&quot;rule&quot;&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;What you brought&lt;/strong&gt;&lt;br&gt;The identity, evidence, and representations used.&lt;/p&gt;&lt;div class=&quot;rule&quot;&gt;&lt;/div&gt;&lt;p&gt;&lt;strong&gt;What you discovered&lt;/strong&gt;&lt;br&gt;New context, questions, and reflections preserved with the journey.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;section class=&quot;page-section&quot; data-section=&quot;honesty&quot;&gt;
          &lt;span class=&quot;eyebrow&quot;&gt;08 — Understanding without false certainty&lt;/span&gt;&lt;h2 class=&quot;headline&quot;&gt;CIE keeps what is known separate from what is still emerging.&lt;/h2&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
