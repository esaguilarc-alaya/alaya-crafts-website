  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

        &lt;section class=&quot;home-section&quot; data-section=&quot;forms&quot;&gt;
          &lt;span class=&quot;section-index&quot;&gt;06 — Where the idea is taking form&lt;/span&gt;
          &lt;div class=&quot;cie-definition&quot;&gt;
            &lt;h2 class=&quot;headline&quot;&gt;Capability Intelligence Engine &lt;span style=&quot;white-space:nowrap&quot;&gt;(CIE)&lt;/span&gt;&lt;/h2&gt;
            &lt;div class=&quot;cie-definition-copy&quot;&gt;
              &lt;p&gt;A way of making capability understandable through the knowledge, evidence, experiences, and relationships that give it shape. When capability becomes visible, its relationships can become understandable.&lt;/p&gt;
              &lt;p&gt;Alaya calls this &lt;strong&gt;Capability Intelligence&lt;/strong&gt;: understanding capability through the knowledge, evidence, experience, objectives, and relationships that surround it.&lt;/p&gt;
              &lt;p&gt;The &lt;strong&gt;Capability Intelligence Engine (CIE)&lt;/strong&gt; is the technology Alaya is building to make that understanding usable.&lt;/p&gt;
            &lt;/div&gt;
          &lt;/div&gt;
          &lt;h3 class=&quot;scale-headline&quot;&gt;One landscape. Different scales and ways of understanding it.&lt;/h3&gt;
          &lt;div class=&quot;maturity-field&quot;&gt;
            &lt;div class=&quot;present-expression&quot;&gt;&lt;span class=&quot;section-index&quot;&gt;Living expression today&lt;/span&gt;&lt;strong&gt;CIE Professional&lt;/strong&gt;&lt;p class=&quot;lede&quot;&gt;A place for a person to begin understanding the capability their work has created.&lt;/p&gt;&lt;/div&gt;
            &lt;div class=&quot;future-field&quot;&gt;&lt;div&gt;&lt;b&gt;Teams&lt;/b&gt;&lt;br&gt;an emerging direction&lt;/div&gt;&lt;div&gt;&lt;b&gt;Organizations&lt;/b&gt;&lt;br&gt;a broader scale with practical work today&lt;/div&gt;&lt;div&gt;&lt;b&gt;Collective Intelligence&lt;/b&gt;&lt;br&gt;A future possibility: learning from patterns across capability landscapes while preserving the distinction between individual knowledge and collective insight.&lt;/div&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/section&gt;

        &lt;/section&gt;

        &lt;section class=&quot;home-section&quot; data-section=&quot;organizations&quot;&gt;

          &lt;div class=&quot;conditions&quot;&gt;&lt;div class=&quot;condition&quot;&gt;&lt;span&gt;01&lt;/span&gt;&lt;div&gt;Where does strategy lose coherence as it becomes work?&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;condition&quot;&gt;&lt;span&gt;02&lt;/span&gt;&lt;div&gt;What knowledge disappears between teams or systems?&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;condition&quot;&gt;&lt;span&gt;03&lt;/span&gt;&lt;div&gt;What capability already exists but remains fragmented or difficult to reuse?&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;section class=&quot;home-section&quot; data-section=&quot;origin&quot;&gt;
          &lt;div class=&quot;origin&quot;&gt;&lt;span class=&quot;section-index&quot;&gt;09 — Origin&lt;/span&gt;&lt;p class=&quot;lede&quot;&gt;The ideas behind Alaya emerged through more than two decades of work across technology, engineering, leadership, product thinking, organizational systems, knowledge, and execution. Across that work, one thread kept resurfacing: capability endured beyond the systems, roles, and technologies around it.&lt;/p&gt;&lt;/div&gt;
